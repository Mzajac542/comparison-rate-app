<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ustaw nowy adres e-mail</title>
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:20px;display:flex;align-items:center;justify-content:center;background:#111318;color:#fff;font-family:Arial,sans-serif}.card{width:100%;max-width:440px;padding:30px;border:1px solid #374151;border-radius:16px;background:#1b1f27;box-shadow:0 24px 60px rgba(0,0,0,.55)}h1{margin:0 0 10px;font-size:1.55rem}.description{margin:0 0 24px;color:#aeb8c7;line-height:1.55}.form-group{margin-bottom:15px}label{display:block;margin-bottom:7px;color:#cbd5e1;font-size:.87rem;font-weight:bold}input{width:100%;padding:12px;border:1px solid #465063;border-radius:8px;outline:none;background:#101319;color:#fff}input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer;font-weight:bold}button:hover{background:#2563eb}button:disabled{cursor:wait;opacity:.65}.message{display:none;margin:16px 0 0;padding:11px;border-radius:8px;line-height:1.45}.message.error{display:block;color:#fecaca;background:rgba(127,29,29,.35);border:1px solid #7f1d1d}.message.success{display:block;color:#a7f3d0;background:rgba(6,78,59,.35);border:1px solid #065f46}.app-link{display:none;margin-top:16px;color:#60a5fa;text-align:center;text-decoration:none}.app-link.visible{display:block}
</style>
</head>
<body>
<main class="card">
<h1>Ustaw nowy adres e-mail</h1>
<p class="description">Wpisz nowy adres dwa razy. Link jest jednorazowy i ważny przez 30 minut.</p>
<form id="form">
<div class="form-group"><label for="new-email">Nowy adres e-mail</label><input id="new-email" type="email" autocomplete="email" required></div>
<div class="form-group"><label for="confirm-email">Powtórz nowy adres e-mail</label><input id="confirm-email" type="email" autocomplete="email" required></div>
<button id="submit" type="submit">Zmień adres e-mail</button>
</form>
<p id="message" class="message"></p>
<a id="app-link" class="app-link" href="http://localhost:5173">Wróć do aplikacji</a>
</main>
<script>
const params=new URLSearchParams(window.location.search);const token=params.get("token")||"";const form=document.getElementById("form");const message=document.getElementById("message");const button=document.getElementById("submit");const appLink=document.getElementById("app-link");
function showMessage(text,type){message.innerText=text;message.className=`message ${type}`}
async function validateToken(){if(!token){form.style.display="none";showMessage("Brak tokenu zmiany adresu.","error");return}try{const response=await fetch(`/api/account/email-change/validate?token=${encodeURIComponent(token)}`);const data=await response.json();if(!response.ok){form.style.display="none";throw new Error(data.error||"Link jest nieprawidłowy.")}}catch(error){showMessage(error.message,"error")}}
form.addEventListener("submit",async(event)=>{event.preventDefault();const newEmail=document.getElementById("new-email").value.trim();const confirmEmail=document.getElementById("confirm-email").value.trim();if(newEmail.toLowerCase()!==confirmEmail.toLowerCase()){showMessage("Adresy e-mail nie są identyczne.","error");return}button.disabled=true;button.innerText="Zapisywanie...";try{const response=await fetch("/api/account/email-change/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newEmail,confirmEmail})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Nie udało się zmienić adresu.");form.style.display="none";showMessage(data.message,"success");appLink.classList.add("visible")}catch(error){showMessage(error.message,"error")}finally{button.disabled=false;button.innerText="Zmień adres e-mail"}});validateToken();
</script>
</body>
</html>
