<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Ustaw nowe hasło</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111318;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #374151;
            border-radius: 16px;
            background: #1b1f27;
            box-shadow:
                0 24px 60px
                rgba(0, 0, 0, 0.55);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.55rem;
        }

        .description {
            margin: 0 0 24px;
            color: #aeb8c7;
            line-height: 1.55;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 0.87rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #465063;
            border-radius: 8px;
            outline: none;
            background: #101319;
            color: #ffffff;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.15);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #3b82f6;
            color: #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .message {
            display: none;
            margin: 16px 0 0;
            padding: 11px;
            border-radius: 8px;
            line-height: 1.45;
        }

        .message.error {
            display: block;
            color: #fecaca;
            background:
                rgba(127, 29, 29, 0.35);
            border: 1px solid #7f1d1d;
        }

        .message.success {
            display: block;
            color: #a7f3d0;
            background:
                rgba(6, 78, 59, 0.35);
            border: 1px solid #065f46;
        }

        .login-link {
            display: none;
            margin-top: 16px;
            color: #60a5fa;
            text-align: center;
            text-decoration: none;
        }

        .login-link.visible {
            display: block;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>Ustaw nowe hasło</h1>

        <p class="description">
            Wpisz nowe hasło dwa razy.
            Link może zostać wykorzystany tylko raz.
        </p>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">
                    Nowe hasło
                </label>

                <input
                    id="new-password"
                    type="password"
                    minlength="6"
                    maxlength="100"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    Powtórz nowe hasło
                </label>

                <input
                    id="confirm-password"
                    type="password"
                    minlength="6"
                    maxlength="100"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                id="submit-button"
                type="submit"
            >
                Zmień hasło
            </button>
        </form>

        <p
            id="message"
            class="message"
        ></p>

        <a
            id="login-link"
            class="login-link"
            href="/login.html"
        >
            Przejdź do logowania
        </a>
    </main>

    <script>
        const params =
            new URLSearchParams(
                window.location.search
            );

        const token =
            params.get("token") || "";

        const form =
            document.getElementById(
                "reset-form"
            );

        const message =
            document.getElementById(
                "message"
            );

        const button =
            document.getElementById(
                "submit-button"
            );

        const loginLink =
            document.getElementById(
                "login-link"
            );

        function showMessage(
            text,
            type
        ) {
            message.innerText = text;
            message.className =
                `message ${type}`;
        }

        async function validateToken() {
            if (!token) {
                form.style.display =
                    "none";

                showMessage(
                    "Brak tokenu zmiany hasła.",
                    "error"
                );

                return;
            }

            try {
                const response = await fetch(
                    `/api/password-reset/validate?token=${encodeURIComponent(
                        token
                    )}`
                );

                const data =
                    await response.json();

                if (!response.ok) {
                    form.style.display =
                        "none";

                    throw new Error(
                        data.error ||
                        "Link jest nieprawidłowy."
                    );
                }

            } catch (error) {
                showMessage(
                    error.message,
                    "error"
                );
            }
        }

        form.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                const newPassword =
                    document.getElementById(
                        "new-password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirm-password"
                    ).value;

                if (
                    newPassword !==
                    confirmPassword
                ) {
                    showMessage(
                        "Podane hasła nie są identyczne.",
                        "error"
                    );

                    return;
                }

                button.disabled = true;
                button.innerText =
                    "Zapisywanie...";

                try {
                    const response =
                        await fetch(
                            "/api/password-reset/complete",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify({
                                        token,
                                        newPassword,
                                        confirmPassword
                                    })
                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error ||
                            "Nie udało się zmienić hasła."
                        );
                    }

                    form.style.display =
                        "none";

                    showMessage(
                        data.message,
                        "success"
                    );

                    loginLink.classList.add(
                        "visible"
                    );

                } catch (error) {
                    showMessage(
                        error.message,
                        "error"
                    );

                } finally {
                    button.disabled = false;
                    button.innerText =
                        "Zmień hasło";
                }
            }
        );

        validateToken();
    </script>
</body>
</html>
